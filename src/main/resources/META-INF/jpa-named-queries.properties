veicoli.list.filters=\
    select v from Veicoli v \
    left join fetch v.tipoVeicolo tv \
    left join fetch v.tipoCategoria tc \
    left join fetch v.macchina mac \
    left join fetch v.moto mot \
    left join fetch v.bici bic \
    left join mac.targa tmac \
    left join mot.targa tmot \
    left join v.tipoAlimentazione ta \
    left join v.colore co \
    left join v.marca ma \
    left join bic.freno fr \
    left join bic.sospensione so \
    where (:tipoVeicolo is null or tv.tipo like :tipoVeicolo) and \
          (:tipoCategoria is null or tc.nome like :tipoCategoria) and \
          (:modello is null or v.modello like :modello) and \
          (:annoProduzione is null or v.annoProduzione = :annoProduzione) and \
          (:nRuote is null or v.nRuote = :nRuote) and \
          (:tipoAlimentazione is null or ta.nome = lower(:tipoAlimentazione)) and \
          (:colore is null or co.nome = lower(:colore)) and \
          (:marca is null or ma.nome = upper(:marca)) and \
          (:targa is null or (tmac.targa = lower(:targa) or tmot.targa = lower(:targa))) and \
          (:cc is null or (mac.cc = :cc or mot.cc = :cc)) and \
          (:porte is null or mac.porte = :porte) and \
          (:marce is null or bic.marce = :marce) and \
          (:corone is null or bic.corone = :corone) and \
          (:pieghevole is null or bic.pieghevole = :pieghevole) and \
          (:freno is null or fr.tipo = lower(:freno)) and \
          (:sospensione is null or so.nome = lower(:sospensione))