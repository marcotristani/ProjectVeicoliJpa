
veicoli.list.filters= select v from Veicoli v \
					left join fetch v.tipoVeicolo tv \
					left join fetch v.tipoCategoria tc \
					left join fetch v.macchina mac \
					left join fetch v.moto mot \
					left join fetch v.bici bic where \
					(:tipoVeicolo is null or tv.tipo like :tipoVeicolo%) and \
					(:tipoCategoria is null or tc.nome like :tipoCategoria%)

